name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      # In the official PHP image, so the check does not depend on the runner
      # image shipping PHP.
      - name: Check the Drupal module's PHP syntax
        run: >-
          docker run --rm -v "$PWD/drupal:/drupal" -w /drupal php:8.3-cli
          sh -c "find . -name '*.php' -print0 | xargs -0 -n1 php -l"

      - name: Test
        run: uv run pytest
