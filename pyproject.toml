[project]
name = "archipelago-value-mapper"
version = "0.1.0"
description = "Clean up name, subject and genre values across Archipelago Digital Objects through a spreadsheet."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-calamine>=0.9.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "xlsxwriter>=3.3.1",
]

[project.scripts]
value-mapper = "value_mapper.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "responses>=0.26.3",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["value_mapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
